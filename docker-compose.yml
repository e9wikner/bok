# Docker Compose deployment. Defaults suit localhost; for a LAN server set
# NEXT_PUBLIC_API_URL so the browser reaches the API directly, e.g.
#   NEXT_PUBLIC_API_URL=http://myhost:8000 docker compose up -d --build
# The live instance on hubbabubba runs Podman quadlets instead — see
# deploy/hubbabubba/README.md.

services:
  bokfoering-api:
    build: .
    container_name: bokfoering-api
    ports:
      - "8000:8000"
    volumes:
      - bokfoering-data:/app/data
      # Folder-based intake. Point DROPZONE_HOST_DIR at the host directory that
      # receives files; the mount is harmless while DROPZONE_ENABLED is false.
      - ${DROPZONE_HOST_DIR:-./dropzone}:/app/data/dropzone
    environment:
      - DEBUG=${DEBUG:-False}
      - BOKFOERING_API_KEY=${BOKFOERING_API_KEY:-dev-key-change-in-production}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DATABASE_URL=sqlite:////app/data/bokfoering.db
      - DROPZONE_ENABLED=${DROPZONE_ENABLED:-false}
      - DROPZONE_DIR=/app/data/dropzone
    command: sh -c "python main.py --init-db && python main.py --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend-v3
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: bokfoering-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://bokfoering-api:8000
    restart: unless-stopped
    depends_on:
      bokfoering-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bokfoering-data:
